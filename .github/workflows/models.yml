name: models

# Keeps models.json (and the compiled fallback table) in sync with the
# latest official CLI release. The Go plan has no server-side model-list
# endpoint, so the roster is extracted from the CLI bundle's static
# catalog (see scripts/extract-models.py).
#
# - models.json is the data contract the plugin fetches at runtime
#   (models_url). Committed to main so raw.githubusercontent.com serves it.
# - go/models_generated.go is regenerated from the same run and committed
#   alongside, so builds carry a fresh fallback even for offline users.
# - `go test` runs before any commit: a broken extraction or a
#   non-compiling table fails the job instead of landing on main.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install latest official CLI
        run: |
          npm install -g command-code@latest
          command-code --version || cmd --version || true

      - name: Fetch models.dev data
        run: |
          rm -rf /tmp/models.dev
          git clone -q --depth 1 --filter=blob:none --sparse \
            https://github.com/anomalyco/models.dev /tmp/models.dev
          git -C /tmp/models.dev sparse-checkout set models

      - name: Extract model roster
        run: |
          CLI="$(npm root -g)/command-code/dist/cli.mjs"
          PKG="$(npm root -g)/command-code/package.json"
          REV="$(git -C /tmp/models.dev rev-parse --short HEAD)"
          python3 scripts/extract-models.py \
            --cli "$CLI" --package "$PKG" \
            --prev models.json --models-dev /tmp/models.dev/models \
            --models-dev-rev "$REV" \
            --out models.json --gen go/models_generated.go
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Vet and test
        run: |
          cd go
          gofmt -l .
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...

      - name: Commit refreshed roster
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(models): refresh roster from command-code@latest"
          file_pattern: "models.json go/models_generated.go"
