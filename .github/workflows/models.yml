name: Refresh model roster

'on':
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      allow_large_drift:
        description: "Allow reviewed large roster changes"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: models-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ github.ref_type == 'branch' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: '1'
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly -trimpath -buildvcs=true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Test extractor
        run: python3 -m unittest discover -s scripts -p 'test_extract_models.py'

      - name: Generate and validate roster
        env:
          ALLOW_DRIFT: ${{ inputs.allow_large_drift }}
        run: |
          EXTRA=()
          if [ "$ALLOW_DRIFT" = "true" ]; then EXTRA+=(--allow-large-drift); fi
          # Public GETs only: Go planScope IDs + models.dev catalog JSON.
          # The extractor bounds/retries downloads and validates both sources
          # before replacing either generated file.
          python3 scripts/extract-models.py --prev models.json \
            --out models.json --gen go/models_generated.go "${EXTRA[@]}"
          python3 scripts/extract-models.py --check

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
          cache-dependency-path: go/go.sum
      - name: Prepare dependencies and run the complete offline gate
        run: |
          bash scripts/ci-prepare.sh
          bash scripts/ci-check.sh
          git diff --exit-code -- go/go.mod go/go.sum

      - name: Commit refreshed roster
        uses: stefanzweifel/git-auto-commit-action@28e16e81777b558cc906c8750092100bbb34c5e3 # v7.0.0
        with:
          commit_message: "chore(models): refresh Go plan roster and model references"
          file_pattern: "models.json go/models_generated.go"
          # Commit exactly the tested checkout. If upstream advanced meanwhile,
          # ordinary non-force push fails instead of rebasing untested changes.
          skip_fetch: true
          skip_checkout: true
