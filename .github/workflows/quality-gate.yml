name: Reusable native quality gate

'on':
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: '1'
      GOOS: linux
      GOARCH: ${{ matrix.arch }}
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly -trimpath -buildvcs=true
      TARGET_ARCH: ${{ matrix.arch }}
      RUNNER_LABEL: ${{ matrix.runner }}
    steps:
      - name: Check out exact triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
          cache-dependency-path: go/go.sum

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'

      - name: Run complete offline gate and verify plugin provenance
        run: bash scripts/ci-build.sh

      - name: Retain verified plugin and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cmdcode-go-linux-${{ matrix.arch }}-${{ github.sha }}
          path: build/ci-artifact/
          if-no-files-found: error
          overwrite: true
          retention-days: 14

      - name: Retain diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-logs-linux-${{ matrix.arch }}-${{ github.sha }}
          path: build/ci-logs/
          if-no-files-found: warn
          overwrite: true
          retention-days: 14
